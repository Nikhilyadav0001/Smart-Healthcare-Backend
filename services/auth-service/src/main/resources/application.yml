spring:
  application:
    name: auth-service
  config:
    import: "configserver:http://localhost:8888"
  cloud:
    config:
      username: config
      password: dev-config-pass
  datasource:
    password: ${AUTH_DB_PASSWORD}
  data:
    redis:
      password: ${REDIS_PASSWORD}

  jackson:
    time-zone: Asia/Kolkata

eureka:
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
