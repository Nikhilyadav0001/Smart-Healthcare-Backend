spring:
  application:
    name: config-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:native}
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_SEARCH_LOCATIONS:file:./smart-healthcare-config,file:../smart-healthcare-config,file:C:/Users/nikhi/OneDrive/Desktop/smart-healthcare/smart-healthcare-config}
        git:
          uri: https://github.com/Nikhilyadav0001/smart-healthcare-config.git
          default-label: main
          username: Nikhilyadav0001
          password: ${CONFIG_GIT_TOKEN:}
          force-pull: true
  security:
    user:
      name: ${CONFIG_SERVER_USERNAME:config}
      password: ${CONFIG_SERVER_PASSWORD:}

server:
  port: 8888
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
