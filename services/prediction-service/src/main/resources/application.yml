server:
  port: 8085

spring:
  application:
    name: prediction-service

  config:
    import: "optional:configserver:http://localhost:8888"

  cloud:
    config:
      username: ${CONFIG_SERVER_USERNAME:config}
      password: ${CONFIG_SERVER_PASSWORD:}
      fail-fast: false

  datasource:
    url: jdbc:postgresql://${PREDICTION_DB_HOST:localhost}:${PREDICTION_DB_PORT:5433}/prediction_db?options=-c%20timezone=UTC
    username: ${PREDICTION_DB_USERNAME:prediction_user}
    password: ${PREDICTION_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

prediction:
  models-path: models

go-service:
  grpc:
    host: ${GO_GRPC_HOST:localhost}
    port: ${GO_GRPC_PORT:9095}

health-data-service:
  grpc:
    host: ${HEALTH_DATA_GRPC_HOST:localhost}
    port: ${HEALTH_DATA_GRPC_PORT:9083}
