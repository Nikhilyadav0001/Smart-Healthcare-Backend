spring:
  application:
    name: service-template
  config:
    import: "configserver:http://localhost:8888"
  cloud:
    config:
      username: config
      password: dev-config-pass

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
