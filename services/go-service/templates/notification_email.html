<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Subject }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f1f5f9; margin: 0; padding: 24px; color: #1e293b; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .header { background: #0f172a; padding: 20px 32px; text-align: left; }
        .header h1 { color: #ffffff; margin: 0; font-size: 18px; font-weight: 700; }
        .content { padding: 32px; line-height: 1.6; }
        .alert-box { background: #f8fafc; border-left: 4px solid #2563eb; padding: 16px; margin: 20px 0; border-radius: 0 4px 4px 0; }
        .footer { padding: 16px 32px; background: #f8fafc; border-top: 1px solid #e2e8f0; font-size: 12px; color: #64748b; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Smart Healthcare Notification</h1>
        </div>
        <div class="content">
            {{ if .ToName }}<p>Hello <strong>{{ .ToName }}</strong>,</p>{{ else }}<p>Hello,</p>{{ end }}
            <p>You have received the following notification regarding your Smart Healthcare account:</p>
            <div class="alert-box">
                <p style="margin: 0; font-weight: 600; font-size: 14px; color: #1e293b;">{{ .Subject }}</p>
                <p style="margin: 8px 0 0; font-size: 13px; color: #334155; white-space: pre-line;">{{ .Body }}</p>
            </div>
            <p style="font-size: 12px; color: #64748b; margin-top: 24px;">Type: {{ .Type }}</p>
        </div>
        <div class="footer">
            &copy; Smart Healthcare Disease Risk Prediction System.
        </div>
    </div>
</body>
</html>
