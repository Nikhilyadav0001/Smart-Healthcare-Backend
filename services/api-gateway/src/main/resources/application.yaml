spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    config:
      username: ${CONFIG_SERVER_USERNAME:config}
      password: ${CONFIG_SERVER_PASSWORD:}
      fail-fast: false
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: auth-service-route
              uri: ${AUTH_SERVICE_URI:http://auth-service:8081}
              predicates:
                - Path=/api/auth/**
              filters:
                - RewritePath=/api/auth/(?<segment>.*), /auth/$\{segment}
            - id: auth-service-direct-route
              uri: ${AUTH_SERVICE_URI:http://auth-service:8081}
              predicates:
                - Path=/auth/**
            - id: prediction-service-route
              uri: ${PREDICTION_SERVICE_URI:http://prediction-service:8085}
              predicates:
                - Path=/api/predictions/**
              filters:
                - RewritePath=/api/predictions/(?<segment>.*), /api/v1/predictions/$\{segment}
            - id: health-data-service-route
              uri: ${HEALTH_SERVICE_URI:http://health-data-service:8083}
              predicates:
                - Path=/api/health/**
              filters:
                - RewritePath=/api/health/(?<segment>.*), /api/v1/health/$\{segment}
            - id: user-profile-service-route
              uri: ${USER_PROFILE_SERVICE_URI:http://user-profile-service:8082}
              predicates:
                - Path=/api/users/**
              filters:
                - RewritePath=/api/users/(?<segment>.*), /api/v1/users/$\{segment}

  security:
    oauth2:
      client:
        registration:
          healthapp:
            provider: auth-server
            client-id: healthapp-bff
            client-secret: ${BFF_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          auth-server:
            authorization-uri: ${AUTH_AUTHORIZATION_URI:http://localhost:8081/oauth2/authorize}
            token-uri: ${AUTH_TOKEN_URI:http://auth-service:8081/oauth2/token}
            jwk-set-uri: ${AUTH_JWK_SET_URI:http://auth-service:8081/oauth2/jwks}
            user-name-attribute: sub

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      enabled: true
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
