syntax = "proto3";

package profile.v1;

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_PATIENT = 1;
  ROLE_DOCTOR = 2;
  ROLE_ADMIN = 3;
}

message Profile {
  string user_id = 1;
  string full_name = 2;
  string email = 3;
  Role role = 4;
  string date_of_birth = 5; // ISO date, yyyy-mm-dd
  string phone = 6;
}

message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  Profile profile = 1;
}

message IsDoctorAssignedRequest {
  string doctor_id = 1;
  string patient_id = 2;
}

message IsDoctorAssignedResponse {
  bool assigned = 1;
}

service ProfileService {
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc IsDoctorAssigned(IsDoctorAssignedRequest) returns (IsDoctorAssignedResponse);
}
