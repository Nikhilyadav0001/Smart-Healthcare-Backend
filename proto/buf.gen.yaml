version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/smarthealth/go-service/gen
    - file_option: java_package_prefix
      value: com.smarthealth
    - file_option: java_multiple_files
      value: true
plugins:
  - local: protoc-gen-go
    out: ../services/go-service/gen
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../services/go-service/gen
    opt:
      - paths=source_relative
  - remote: buf.build/protocolbuffers/java
    out: ../services/prediction-service/src/main/java
  - remote: buf.build/grpc/java
    out: ../services/prediction-service/src/main/java
  - remote: buf.build/protocolbuffers/java
    out: ../services/health-data-service/src/main/java
  - remote: buf.build/grpc/java
    out: ../services/health-data-service/src/main/java
