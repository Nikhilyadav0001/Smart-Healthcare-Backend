name: smart-healthcare-observability

services:
  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ../alloy:/etc/alloy:ro
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:12345:12345"
    depends_on:
      - loki
      - tempo

  tempo:
    image: grafana/tempo:3.0.0
    container_name: tempo
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ../tempo:/etc/tempo:ro
      - tempo_data:/var/tempo

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ../prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Database Exporters for Ping, Health & Replication Metrics
  postgres-auth-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-auth-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:nikhil@host.docker.internal:5433/auth_db?sslmode=disable"
    ports:
      - "127.0.0.1:9187:9187"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres-auth-replica-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-auth-replica-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:nikhil@host.docker.internal:5434/auth_db?sslmode=disable"
    ports:
      - "127.0.0.1:9188:9187"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres-prediction-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-prediction-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:nikhil@host.docker.internal:5435/prediction_db?sslmode=disable"
    ports:
      - "127.0.0.1:9189:9187"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres-prediction-replica-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-prediction-replica-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:nikhil@host.docker.internal:5436/prediction_db?sslmode=disable"
    ports:
      - "127.0.0.1:9190:9187"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mariadb-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mariadb-exporter
    restart: unless-stopped
    command:
      - --mysqld.address=host.docker.internal:3308
      - --mysqld.username=root
    environment:
      MYSQLD_EXPORTER_PASSWORD: "nikhil"
    ports:
      - "127.0.0.1:9104:9104"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    container_name: mongodb-exporter
    restart: unless-stopped
    command:
      - --mongodb.uri=mongodb://host.docker.internal:27018/?directConnection=true
      - --compatible-mode
      - --collect-all
    ports:
      - "127.0.0.1:9216:9216"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  loki_data:
  grafana_data:
  tempo_data:
  prometheus_data:
