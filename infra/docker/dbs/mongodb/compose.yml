services:
  mongo:
    image: mongo:7.0
    container_name: db-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27117"]
    ports:
      - "127.0.0.1:27117:27117"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port 27117 --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # one-shot: runs rs.initiate once, then exits
  mongo-init:
    image: mongo:7.0
    container_name: db-mongo-init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./init:/init:ro
    entrypoint: ["mongosh", "mongodb://mongo:27117/?directConnection=true", "--file", "/init/rs-init.js"]

volumes:
  mongo_data:
