global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: spring-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: api-gateway
      - targets: ["host.docker.internal:8761"]
        labels:
          service: discovery-server
      - targets: ["host.docker.internal:9090"]
        labels:
          service: admin-server
      - targets: ["host.docker.internal:8081"]
        labels:
          service: auth-service
      - targets: ["host.docker.internal:8082"]
        labels:
          service: user-profile-service
      - targets: ["host.docker.internal:8083"]
        labels:
          service: health-data-service
      - targets: ["host.docker.internal:8085"]
        labels:
          service: prediction-service

  - job_name: go-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8086"]
        labels:
          service: go-service

  - job_name: frontend
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5173"]
        labels:
          service: frontend

  - job_name: config-server
    metrics_path: /actuator/prometheus
    basic_auth:
      username: config
      password: dev-config-pass
    static_configs:
      - targets: ["host.docker.internal:8888"]
        labels:
          service: config-server

  # Database Exporters (Ping, Health & Replication Lag across Primary & Replicas)
  - job_name: db-postgres-exporter
    static_configs:
      - targets: ["host.docker.internal:9187"]
        labels:
          database: postgresql
          db_role: primary
          service: auth_db (primary)
      - targets: ["host.docker.internal:9188"]
        labels:
          database: postgresql
          db_role: replica
          service: auth_db (replica)
      - targets: ["host.docker.internal:9189"]
        labels:
          database: postgresql
          db_role: primary
          service: prediction_db (primary)
      - targets: ["host.docker.internal:9190"]
        labels:
          database: postgresql
          db_role: replica
          service: prediction_db (replica)

  - job_name: db-mariadb-exporter
    static_configs:
      - targets: ["host.docker.internal:9104"]
        labels:
          database: mariadb
          db_role: primary
          service: profile_db

  - job_name: db-mongodb-exporter
    static_configs:
      - targets: ["host.docker.internal:9216"]
        labels:
          database: mongodb
          db_role: replica-set
          service: health_data_db (rs0)
