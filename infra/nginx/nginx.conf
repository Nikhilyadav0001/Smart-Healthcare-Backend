# ==============================================================================
# SMART HEALTHCARE PLATFORM - EDGE REVERSE PROXY & SECURITY GATEWAY
# Features: HTTPS / TLS, Tiered Rate Limiting, Connection Limiting, Admin Shield
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Logging with Real Client IP & Rate Limit Status
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ==========================================================================
    # RATE LIMITING & CONNECTION THROTTLING ZONES
    # ==========================================================================
    # 1. Strict Auth Zone: 5 requests per minute (Anti-Brute Force / Credential Stuffing)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # 2. ML & Report Compute Zone: 10 requests per minute (Protects CPU/Memory Intensive Models)
    limit_req_zone $binary_remote_addr zone=compute_limit:10m rate=10r/m;

    # 3. Standard API Zone: 30 requests per second (Normal patient vitals & queries)
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;

    # 4. Connection Limiting: Max 15 concurrent TCP connections per IP (Anti-Slowloris)
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Return standard HTTP 429 Too Many Requests when rate limit exceeded
    limit_req_status 429;
    limit_conn_status 429;

    # ==========================================================================
    # UPSTREAM SERVICES
    # ==========================================================================
    upstream gateway_upstream {
        server host.docker.internal:8080 max_fails=0;
        keepalive 32;
    }

    upstream frontend_upstream {
        server host.docker.internal:5173 max_fails=0;
        keepalive 32;
    }

    upstream admin_server_upstream {
        server host.docker.internal:9090 max_fails=0;
        keepalive 16;
    }

    upstream discovery_server_upstream {
        server host.docker.internal:8761 max_fails=0;
        keepalive 16;
    }

    upstream mailpit_upstream {
        server host.docker.internal:8025 max_fails=0;
        keepalive 16;
    }

    # ==========================================================================
    # HTTP SERVER (Port 80)
    # ==========================================================================
    server {
        listen 80;
        server_name localhost smarthealthcare.dpdns.org;

        # Connection Limit per IP
        limit_conn conn_limit 15;

        # ----------------------------------------------------------------------
        # HEALTH CHECK PROBE (Docker & Kubernetes Liveness)
        # ----------------------------------------------------------------------
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # ----------------------------------------------------------------------
        # PATH-BASED ROUTING VIA REVERSE PROXY (ADMIN TOOLS)
        # ----------------------------------------------------------------------
        location /admin-server/ {
            proxy_pass http://admin_server_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /eureka/ {
            proxy_pass http://discovery_server_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /mailpit/ {
            proxy_pass http://mailpit_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ----------------------------------------------------------------------
        # INTERNAL METRICS SECURITY BOUNDARY
        # ----------------------------------------------------------------------
        location ~* ^/(actuator|instances|prometheus|metrics) {
            default_type application/json;
            return 403 '{"error":"Forbidden","message":"Access to internal raw metrics is restricted.","status":403}\n';
        }

        # Custom 429 Rate Limit JSON Response
        error_page 429 /429.json;
        location = /429.json {
            default_type application/json;
            return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded. Please wait before retrying.","status":429}\n';
        }

        # ----------------------------------------------------------------------
        # 1. AUTHENTICATION & LOGIN (Strict Rate Limiting: 5 req/min, burst=3)
        # ----------------------------------------------------------------------
        location ~* ^/(api/auth/register|auth/login|login/) {
            limit_req zone=auth_limit burst=3 nodelay;

            proxy_pass http://gateway_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/auth/ {
            limit_req zone=api_general_limit burst=10 nodelay;
            proxy_pass http://gateway_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # 2. ML INFERENCE & PDF REPORTS (Compute Rate Limiting: 10 req/min, burst=2)
        # ----------------------------------------------------------------------
        location ~* ^/api/predictions/(predict|.+/report) {
            limit_req zone=compute_limit burst=2 nodelay;

            proxy_pass http://gateway_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # ----------------------------------------------------------------------
        # 3. GENERAL API GATEWAY ROUTES (30 req/s, burst=20)
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_general_limit burst=20 nodelay;

            proxy_pass http://gateway_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /oauth2/ {
            proxy_pass http://gateway_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /logout {
            proxy_pass http://gateway_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # 4. FRONTEND REACT SINGLE PAGE APPLICATION (SPA)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Vite HMR in development
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
