apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: smart-healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: smarthealth/config-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          env:
            - name: CONFIG_SERVER_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: smarthealth-config
                  key: CONFIG_SERVER_USERNAME
            - name: CONFIG_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smarthealth-secrets
                  key: CONFIG_SERVER_PASSWORD
            - name: CONFIG_GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: smarthealth-secrets
                  key: CONFIG_GIT_TOKEN
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "*"
            - name: MANAGEMENT_ENDPOINT_SHUTDOWN_ENABLED
              value: "true"
            - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
              value: "http://host.docker.internal:4318/v1/traces"
            - name: MANAGEMENT_OTLP_LOGGING_ENDPOINT
              value: "http://host.docker.internal:4318/v1/logs"
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://host.docker.internal:4318"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: smart-healthcare
spec:
  type: LoadBalancer
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888
