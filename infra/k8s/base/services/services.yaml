apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: smart-healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-server
  template:
    metadata:
      labels:
        app: discovery-server
    spec:
      containers:
        - name: discovery-server
          image: smarthealth/discovery-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
          env:
            - name: SERVER_PORT
              value: "8761"
            - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
              value: "false"
            - name: EUREKA_CLIENT_FETCH_REGISTRY
              value: "false"
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server:8888"
            - name: CONFIG_SERVER_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: smarthealth-config
                  key: CONFIG_SERVER_USERNAME
            - name: CONFIG_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smarthealth-secrets
                  key: CONFIG_SERVER_PASSWORD
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "*"
            - name: MANAGEMENT_ENDPOINT_SHUTDOWN_ENABLED
              value: "true"
            - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
              value: "http://host.docker.internal:4318/v1/traces"
            - name: MANAGEMENT_OTLP_LOGGING_ENDPOINT
              value: "http://host.docker.internal:4318/v1/logs"
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://host.docker.internal:4318"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
