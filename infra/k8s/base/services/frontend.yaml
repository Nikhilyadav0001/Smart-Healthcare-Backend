apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: smart-healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: smarthealth/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-server:8761/eureka/"
            - name: INSTANCE_HOST
              value: "frontend"
            - name: SERVER_PORT
              value: "80"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: swagger-html
              mountPath: /usr/share/nginx/html/swagger.html
              subPath: swagger.html
      volumes:
        - name: nginx-conf
          configMap:
            name: frontend-nginx-conf
        - name: swagger-html
          configMap:
            name: frontend-swagger-html
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: smart-healthcare
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      port: 5173
      targetPort: 80
    - name: internal
      port: 80
      targetPort: 80
