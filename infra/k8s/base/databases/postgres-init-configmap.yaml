apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-auth-init-script
  namespace: smart-healthcare
data:
  01-create-auth-db.sh: |
    #!/bin/bash
    set -e

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<-EOSQL
      DO \$\$
      BEGIN
        IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'auth_user') THEN
          CREATE USER auth_user WITH PASSWORD '${AUTH_DB_PASSWORD}';
        END IF;
        IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'replicator') THEN
          CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD '${AUTH_DB_PASSWORD}';
        END IF;
      END
      \$\$;

      SELECT 'CREATE DATABASE auth_db OWNER auth_user'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'auth_db')\gexec

      REVOKE CONNECT ON DATABASE auth_db FROM PUBLIC;
    EOSQL

    echo "host replication replicator all trust" >> "$PGDATA/pg_hba.conf"
    echo "host all all all trust" >> "$PGDATA/pg_hba.conf"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres -c "SELECT pg_reload_conf();"
---
