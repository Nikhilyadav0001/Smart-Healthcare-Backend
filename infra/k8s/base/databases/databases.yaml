# ==============================================================================
# MARIADB (Profile DB)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: smart-healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smarthealth-secrets
                  key: MARIADB_ROOT_PASSWORD
            - name: MARIADB_DATABASE
              value: "profile_db"
            - name: MARIADB_USER
              value: "profile_user"
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smarthealth-secrets
                  key: PROFILE_DB_PASSWORD
            - name: TZ
              value: "Asia/Kolkata"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: smart-healthcare
spec:
  selector:
    app: mariadb
  ports:
    - port: 3306
      targetPort: 3306
---
# ==============================================================================
# MONGODB (3-Node Replica Set rs0 with Arbiter)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
  namespace: smart-healthcare
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: smart-healthcare
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: smart-healthcare
spec:
  serviceName: mongodb-headless
  replicas: 3
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          command:
            - /bin/bash
            - -c
            - |
              mongod --replSet rs0 --bind_ip_all --port 27017 &
              MONGOPID=$!
              if [[ "$HOSTNAME" == "mongodb-0" ]]; then
                until mongosh --eval "db.adminCommand('ping')" --quiet >/dev/null 2>&1; do sleep 1; done
                for host in mongodb-1.mongodb-headless mongodb-2.mongodb-headless; do
                  until mongosh --host $host --eval "db.adminCommand('ping')" --quiet >/dev/null 2>&1; do sleep 1; done
                done
                mongosh --quiet --eval "
                  try {
                    if (!rs.status().ok) {
                      rs.initiate({
                        _id: 'rs0',
                        members: [
                          { _id: 0, host: 'mongodb-0.mongodb-headless:27017', priority: 2 },
                          { _id: 1, host: 'mongodb-1.mongodb-headless:27017', priority: 1 },
                          { _id: 2, host: 'mongodb-2.mongodb-headless:27017', arbiterOnly: true }
                        ]
                      });
                    }
                  } catch (e) {
                    rs.initiate({
                      _id: 'rs0',
                      members: [
                        { _id: 0, host: 'mongodb-0.mongodb-headless:27017', priority: 2 },
                        { _id: 1, host: 'mongodb-1.mongodb-headless:27017', priority: 1 },
                        { _id: 2, host: 'mongodb-2.mongodb-headless:27017', arbiterOnly: true }
                      ]
                    });
                  }
                "
              fi
              wait $MONGOPID
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
# ==============================================================================
# REDIS, KAFKA, MAILPIT
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: smart-healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - "redis-server --requirepass \"$REDIS_PASSWORD\""
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smarthealth-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: smart-healthcare
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: smart-healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "INTERNAL://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNAL://kafka:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka:9093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms384m -Xmx512m"
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: smart-healthcare
spec:
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: smart-healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:latest
          env:
            - name: MP_WEBROOT
              value: mailpit
          ports:
            - containerPort: 1025
            - containerPort: 8025
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: smart-healthcare
spec:
  type: LoadBalancer
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: ui
      port: 8025
      targetPort: 8025

