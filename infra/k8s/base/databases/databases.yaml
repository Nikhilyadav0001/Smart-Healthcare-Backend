# ==============================================================================
# AUTH POSTGRESQL (Primary & Read-Replica)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-auth
  namespace: smart-healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-auth
      role: primary
  template:
    metadata:
      labels:
        app: postgres-auth
        role: primary
    spec:
      containers:
        - name: postgres
          image: postgres:16
          args:
            - -c
            - wal_level=replica
            - -c
            - max_wal_senders=10
            - -c
            - max_replication_slots=10
            - -c
            - hot_standby=on
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smarthealth-secrets
                  key: POSTGRES_PASSWORD
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smarthealth-secrets
                  key: AUTH_DB_PASSWORD
            - name: TZ
              value: "Asia/Kolkata"
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "ln -sf Kolkata /usr/share/zoneinfo/Asia/Calcutta"
          volumeMounts:
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-auth-init-script
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-auth
  namespace: smart-healthcare
spec:
  selector:
    app: postgres-auth
    role: primary
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-auth-replica
  namespace: smart-healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-auth
      role: replica
  template:
    metadata:
      labels:
        app: postgres-auth
        role: replica
    spec:
      containers:
        - name: postgres-replica
          image: postgres:16
          command:
            - /bin/bash
            - -c
            - |
              ln -sf Kolkata /usr/share/zoneinfo/Asia/Calcutta
              until pg_isready -h postgres-auth -p 5432 -U postgres; do sleep 2; done
              if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
                rm -rf /var/lib/postgresql/data/*
                PGPASSWORD="${REPLICATION_PASSWORD}" gosu postgres pg_basebackup -h postgres-auth -p 5432 -U replicator -D /var/lib/postgresql/data -Fp -Xs -R
              fi
              chmod 700 /var/lib/postgresql/data
              exec gosu postgres postgres -D /var/lib/postgresql/data
          ports:
            - containerPort: 5432
          env:
            - name: REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smarthealth-secrets
                  key: AUTH_DB_PASSWORD
            - name: TZ
              value: "Asia/Kolkata"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-auth-replica
  namespace: smart-healthcare
spec:
  selector:
    app: postgres-auth
    role: replica
  ports:
    - port: 5432
      targetPort: 5432
---
