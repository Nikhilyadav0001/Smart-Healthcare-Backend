            - name: MARIADB_USER
              value: "profile_user"
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smarthealth-secrets
                  key: PROFILE_DB_PASSWORD
            - name: TZ
              value: "Asia/Kolkata"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
