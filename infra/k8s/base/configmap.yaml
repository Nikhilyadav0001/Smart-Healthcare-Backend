apiVersion: v1
kind: ConfigMap
metadata:
  name: smarthealth-config
  namespace: smart-healthcare
data:
  SPRING_PROFILES_ACTIVE: "dev,kubernetes"
  EUREKA_CLIENT_ENABLED: "false"
  SPRING_CLOUD_DISCOVERY_ENABLED: "false"
  CONFIG_SERVER_URL: "http://config-server:8888"
  CONFIG_SERVER_USERNAME: "config"
  AUTH_DB_HOST: "postgres-auth"
  AUTH_DB_PORT: "5432"
  PROFILE_DB_HOST: "mariadb"
  PROFILE_DB_PORT: "3306"
  PREDICTION_DB_HOST: "postgres-prediction"
  PREDICTION_DB_PORT: "5432"
  MONGODB_URI: "mongodb://mongodb-0.mongodb-headless:27017,mongodb-1.mongodb-headless:27017,mongodb-2.mongodb-headless:27017/health_data_db?replicaSet=rs0&readPreference=secondaryPreferred"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BROKERS: "kafka:9092"
  MAILPIT_HOST: "mailpit"
  MAILPIT_SMTP_PORT: "1025"
  ALLOY_OTLP_ENDPOINT: "http://host.docker.internal:4318"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://host.docker.internal:4318"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"
  MANAGEMENT_ENDPOINT_SHUTDOWN_ENABLED: "true"
